<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat Group</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Add Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-messages {
            height: 400px;
            overflow-y: auto;
        }

        .group-icon {
            border: 1px solid black;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            /* Use flexbox */
            align-items: center;
            /* Vertical center */
            justify-content: center;
            /* Horizontal center */
            font-size: 20px;
            /* Adjust icon size */
            color: black;
            /* Icon color */
            background: white;
            /* Optional, circle bg */
            box-sizing: border-box;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container-fluid p-0">
        <div class="chat-container mx-auto shadow rounded bg-white"
            style="max-width: 100wh; min-height: 100vh; display: flex; flex-direction: column;">
            <header class="chat-header d-flex justify-content-between align-items-center p-2 border-bottom">
                <div class="left-header d-flex align-items-center gap-2">
                    <i class="fas fa-arrow-left"></i>
                    <i class="fas fa-user group-icon rounded-circle"
                        style="border: 1px solid black; width: 40px; height: 40px; padding: 8px; box-sizing: border-box;"></i>

                    <span class="group-name fw-bold">Fun Friday Group</span>
                </div>
                <div class="right-header d-flex align-items-center gap-3">
                    <i class="fas fa-phone"></i>
                    <i class="fas fa-video"></i>
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </header>

            <main class="chat-messages flex-grow-1 overflow-auto p-2" style="background:#f7f7f7;">
                <!-- All example messages removed. Start with an empty chat area. -->
            </main>

            <div class="anonymous-toggle d-flex align-items-center justify-content-center gap-2 py-2 border-top"
                style="cursor:pointer;">
                <label>
                    <input type="checkbox" id="anonymousToggle" />
                    Send as anonymous
                    <i id="anonymousIcon" class="fas fa-eye" title="Anonymous disabled"></i>
                </label>
                <!-- <i class="fas fa-eye-slash"></i> -->
            </div>


            <footer class="chat-input-area border-top p-2 bg-white">
                <div class="input-group">
                    <input type="text" id="messageInput" class="form-control" placeholder="Type a message...">
                    <button class="btn btn-outline-secondary" type="button"><i class="fas fa-camera"></i></button>
                    <button class="btn btn-outline-secondary" type="button"><i class="fas fa-paperclip"></i></button>
                    <button id="sendBtn" class="btn btn-primary" type="button"><i
                            class="fas fa-paper-plane"></i></button>
                </div>
            </footer>
        </div>
    </div>
    <script src="script.js"></script>
    <!-- Bootstrap JS for mobile interactions -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
