<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roopa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .chat-messages {
      height: 400px;
      overflow-y: auto;
      background: #f7f7f7;
      padding: 10px;
    }

    .group-icon {
      border: 1px solid black;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: black;
      background: white;
      box-sizing: border-box;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container-fluid p-0" style="min-height:100vh;">
    <div class="chat-container shadow rounded bg-white"
      style="max-width: 100wh; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column;position:sticky;">
      <header class="chat-header d-flex justify-content-between align-items-center p-2 border-bottom"style="position:sticky;top:0;background:white;z-index:1000;">
        <div class="left-header d-flex align-items-center gap-2">
          <i class="fas fa-arrow-left"></i>
          <i class="fas fa-user group-icon rounded-circle"></i>
          <span class="group-name fw-bold">Fun Friday Group - Mallika</span>
        </div>
        <div class="right-header d-flex align-items-center gap-3">
          <i class="fas fa-phone"></i>
          <i class="fas fa-video"></i>
          <i class="fas fa-ellipsis-v"></i>
        </div>
      </header>

      <main class="chat-messages flex-grow-1 overflow-auto p-2"></main>

      <div class="anonymous-toggle d-flex align-items-center justify-content-center gap-2 py-2 border-top"style="position: sticky; bottom: 60px; background: white;"
        style="cursor:pointer;">
        <label>
          <input type="checkbox" id="anonymousToggle" />
          Send as anonymous
          <i id="anonymousIcon" class="fas fa-eye" title="Anonymous disabled"></i>
        </label>
      </div>

      <footer class="chat-input-area border-top p-2 bg-white"style="position:sticky;bottom:0;z-index:1000;" >
        <div class="input-group">
          <input type="text" id="messageInput" class="form-control" placeholder="Type a message..." />
          <button class="btn btn-outline-secondary" type="button"><i class="fas fa-camera"></i></button>
          <button class="btn btn-outline-secondary" type="button"><i class="fas fa-paperclip"></i></button>
          <button id="sendBtn" class="btn btn-primary" type="button"><i class="fas fa-paper-plane"></i></button>
        </div>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
